<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>JobSwipe × WTTJ Bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 320px; background: #0d0f12; color: #fff; padding: 18px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo { width: 34px; height: 34px; background: linear-gradient(135deg, #ff416c, #ff4b2b); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    h2 { font-size: 15px; font-weight: 800; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.4; margin-bottom: 14px; }
    .btn-sync { width: 100%; background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s; }
    .btn-sync:hover { opacity: 0.95; }
    .btn-sync:active { transform: scale(0.98); }
    .status-box { margin-top: 14px; padding: 10px; border-radius: 8px; font-size: 11px; display: none; }
    .status-box.success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #10b981; }
    .status-box.error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <h2>JobSwipe WTTJ Sync</h2>
      <span style="font-size: 10px; color: #ffe000; font-weight: 700;">Extension Active</span>
    </div>
  </div>
  <p>Connectez-vous sur Welcome to the Jungle, puis cliquez sur le bouton ci-dessous pour transférer votre session active vers JobSwipe.</p>
  
  <button class="btn-sync" id="btn-sync">
    <span>⚡ Synchroniser ma session WTTJ</span>
  </button>

  <div class="status-box" id="status-box"></div>

  <script src="popup.js"></script>
</body>
</html>
